<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Black background -->
  <rect width="256" height="256" fill="#000000"/>

  <!-- Thick brutalist border -->
  <rect x="8" y="8" width="240" height="240" fill="none" stroke="#FFFFFF" stroke-width="16"/>

  <!-- Inner frame for depth -->
  <rect x="24" y="24" width="208" height="208" fill="none" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Horizontal divider line (MIT architectural style) -->
  <line x1="24" y1="128" x2="232" y2="128" stroke="#FFFFFF" stroke-width="8"/>

  <!-- "PJ" text - large, bold, brutalist -->
  <text x="128" y="100" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="8" dominant-baseline="middle">P</text>
  <text x="128" y="165" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="8" dominant-baseline="middle">J</text>
</svg>
